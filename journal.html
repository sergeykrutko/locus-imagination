    <!-- Підключаємо бібліотеку для перетворення Markdown у HTML -->

    <script>
    // Цей скрипт має бути в <head>, щоб миттєво застосувати тему до рендеру сторінки
    (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();
</script>


<!-- Фіксує колір фону браузера під час переходів, вбиває білий спалах -->

</head>

<body>

    <!-- Виїзна панель для читання (скопійована з index.html) -->

    <div class="side-panel" id="universal-panel">
        <button class="close-panel" id="close-panel">&times;</button>

            <!-- Сюди буде підставлятися відрендерений текст Markdown -->

    <!-- Підключаємо наш реєстр -->
    <!-- <script src="journal.js"></script> -->
     <!-- Підключаємо реєстр із динамічним скиданням кешу -->
<script>
    document.write('<script src="journal.js?v=' + Date.now() + '"><\/script>');
</script>

    <script>

    document.addEventListener("DOMContentLoaded", () => {
    const archiveContainer = document.getElementById("archive-content");
    const searchInput = document.getElementById("journal-search");
    const universalPanel = document.getElementById("universal-panel");
    const overlay = document.getElementById("overlay");
    const dynamicContent = document.getElementById("dynamic-content");
    const closePanelBtn = document.getElementById("close-panel");
    const body = document.body;

    const monthsNames = {
        "01": "Січень", "02": "Лютий", "03": "Березень", "04": "Квітень",
        "05": "Травень", "06": "Червень", "07": "Липень", "08": "Серпень",
        "09": "Вересень", "10": "Жовтень", "11": "Листопад", "12": "Грудень"
    };

    function renderArchive(postsToRender) {
        if (postsToRender.length === 0) {
            archiveContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted);">За вашим запитом нічого не знайдено.</p>';
            return;
        }

        postsToRender.sort((a, b) => new Date(b.date) - new Date(a.date));

        const grouped = {};
        postsToRender.forEach(post => {
            const [year, month, day] = post.date.split("-");
            if (!grouped[year]) grouped[year] = {};
            if (!grouped[year][month]) grouped[year][month] = [];
            post.day = day; 
            grouped[year][month].push(post);
        });

        let html = "";
        Object.keys(grouped).sort((a, b) => b - a).forEach(year => {
            html += `<div class="archive-year">${year}</div>`;
            Object.keys(grouped[year]).sort((a, b) => b - a).forEach(month => {
                const monthName = monthsNames[month] || month;
                html += `<div class="archive-month">${monthName}</div>`;
                html += `<ul class="archive-list">`;
                grouped[year][month].forEach(post => {
                    html += `
                        <li>
                            <span class="archive-date">${post.day}</span>
                            <a class="archive-link" data-file="${post.file}" data-date="${post.date}">
                                ${post.title}
                            </a>
                        </li>
                    `;
                });
                html += `</ul>`;
            });
        });

        archiveContainer.innerHTML = html;
    }

    renderArchive(journalPosts);

    searchInput.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filteredPosts = journalPosts.filter(post => 
            post.title.toLowerCase().includes(query)
        );
        renderArchive(filteredPosts);
    });

    // Нова функція, яка відповідає за відкриття статті та малювання кнопок
    async function openArticle(filePath, rawDate) {
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error("Не вдалося завантажити допис");
            
            const rawMarkdownText = await response.text();
            
            // Шукаємо рядки, що починаються з ">> ", і перетворюємо їх на елегантний блок
            const processedMarkdown = rawMarkdownText.replace(/^>>\s*(.+)$/gm, '<div class="epigraph-elegant">$1</div>');
            
            dynamicContent.innerHTML = marked.parse(processedMarkdown);

            const h1 = dynamicContent.querySelector("h1");
            if (h1) {
                const dateObj = new Date(rawDate);
                const formattedDate = new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj);
                
                // Шукаємо наш епіграф. Якщо він є — ставимо дату ПІСЛЯ нього. Якщо немає — одразу після заголовка.
                const epigraph = dynamicContent.querySelector(".epigraph-elegant");
                if (epigraph) {
                    epigraph.insertAdjacentHTML("afterend", `<div class="article-meta">Сергій Крутько &middot; ${formattedDate}</div>`);
                } else {
                    h1.insertAdjacentHTML("afterend", `<div class="article-meta">Сергій Крутько &middot; ${formattedDate}</div>`);
                }
            }

            // МАГІЯ НАВІГАТОРУ: Шукаємо сусідні тексти
            const currentIndex = journalPosts.findIndex(post => post.file === filePath);
            if (currentIndex !== -1) {
                let navHtml = `<div class="article-navigation" style="display: flex; justify-content: space-between; margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border-light); gap: 16px;">`;

                // Кнопка "Новіше" (попередній у масиві)
                if (currentIndex > 0) {
                    const newerPost = journalPosts[currentIndex - 1];
                    navHtml += `
                        <a href="#" class="nav-btn" data-file="${newerPost.file}" data-date="${newerPost.date}" style="text-decoration: none; color: var(--text-dark); text-align: left; flex: 1;">
                            <div style="font-family: var(--font-sans); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; opacity: 0.5;">&larr; Читати далі</div>
                            <div style="font-family: var(--font-serif); font-size: 16px; line-height: 1.3;">${newerPost.title}</div>
                        </a>`;
                } else {
                    navHtml += `<div style="flex: 1;"></div>`;
                }

                // Кнопка "Старіше" (наступний у масиві)
                if (currentIndex < journalPosts.length - 1) {
                    const olderPost = journalPosts[currentIndex + 1];
                    navHtml += `
                        <a href="#" class="nav-btn" data-file="${olderPost.file}" data-date="${olderPost.date}" style="text-decoration: none; color: var(--text-dark); text-align: right; flex: 1;">
                            <div style="font-family: var(--font-sans); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; opacity: 0.5;">Читати раніше &rarr;</div>
                            <div style="font-family: var(--font-serif); font-size: 16px; line-height: 1.3;">${olderPost.title}</div>
                        </a>`;
                }

                navHtml += `</div>`;
                dynamicContent.insertAdjacentHTML("beforeend", navHtml);
            }

            universalPanel.classList.add("active");
            overlay.classList.add("active");
            body.classList.add("no-scroll");
            universalPanel.scrollTop = 0; // Повертаємо панель наверх при зміні статті

        } catch (error) {
            console.error(error);
            dynamicContent.innerHTML = "<p>Помилка завантаження допису.</p>";
            universalPanel.classList.add("active");
            overlay.classList.add("active");
        }
    }

    // Слухаємо кліки по списку статей
    archiveContainer.addEventListener("click", (e) => {
        const link = e.target.closest(".archive-link");
        if (!link) return;
        const filePath = link.getAttribute("data-file");
        const rawDate = link.getAttribute("data-date");
        openArticle(filePath, rawDate);
    });

    // Слухаємо кліки по кнопках навігації всередині панелі
    dynamicContent.addEventListener("click", (e) => {
        const navLink = e.target.closest(".nav-btn");
        if (navLink) {
            e.preventDefault(); // Щоб сторінка не стрибала
            const filePath = navLink.getAttribute("data-file");
            const rawDate = navLink.getAttribute("data-date");
            openArticle(filePath, rawDate);
        }
    });

    function closeJournalPanel() {
        universalPanel.classList.remove("active");
        overlay.classList.remove("active");
        body.classList.remove("no-scroll");
    }

    closePanelBtn.addEventListener("click", closeJournalPanel);
    overlay.addEventListener("click", closeJournalPanel);
});
    </script>





<!-- Скрипт для мобільного бургер-меню -->
<script>
    const burgerBtn = document.getElementById('burger-btn');
    const siteHeader = document.querySelector('.site-header');
    const menuLinks = document.querySelectorAll('.menu-link');

    burgerBtn.addEventListener('click', () => {
        burgerBtn.classList.toggle('open');
        siteHeader.classList.toggle('menu-open');
        document.body.classList.toggle('no-scroll');
    });

    menuLinks.forEach(link => {
        link.addEventListener('click', () => {
            burgerBtn.classList.remove('open');
            siteHeader.classList.remove('menu-open');
            document.body.classList.remove('no-scroll');
        });
    });
</script>

<!-- Скрипт для перемикання теми -->
<script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    
    const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (themeIcon) {
            themeIcon.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
        }
    }

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    if (savedTheme) {
        setTheme(savedTheme);
    } else {
        setTheme(systemPrefersDark.matches ? 'dark' : 'light');
    }

    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });
    }
</script>


<script>
document.addEventListener('DOMContentLoaded', () => {
    const links = document.querySelectorAll('a');

    links.forEach(link => {
        link.addEventListener('click', function(e) {
            const href = this.getAttribute('href');
            const target = this.getAttribute('target');
            
            // 1. ІГНОРУЄМО ЗОВНІШНІ ПОСИЛАННЯ ТА КОНТАКТИ
            if (!href || target === '_blank' || href.startsWith('mailto:') || href.startsWith('tel:')) {
                return; 
            }

            // 2. ІГНОРУЄМО ЯКОРІ (#) ТА ЛОГОТИП
            // Віддаємо всю роботу браузеру (CSS scroll-behavior: smooth).
            // Це гарантує нульову затримку і 100% плавність.
            if (href.startsWith('#')) {
                return; 
            }

            // 3. ОБРОБКА ПЕРЕХОДІВ МІЖ СТОРІНКАМИ (index.html <-> journal.html)
            if (this.hostname === window.location.hostname) {
                e.preventDefault(); 
                const destination = this.href; 
                
                // Викликаємо красиву "шторку"
                document.body.classList.add('fade-out'); 
                
                // Переходимо на іншу сторінку після анімації
                setTimeout(() => {
                    window.location.href = destination;
                }, 550); 
            }
        });
    });
});

// Захист від кешу при кліку "Назад" у браузері
window.addEventListener('pageshow', function (event) {
    if (event.persisted || document.body.classList.contains('fade-out')) {
        document.body.classList.remove('fade-out');
    }
});
</script>
